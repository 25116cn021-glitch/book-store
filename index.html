<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: #4a1c29;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr;
            height: 100vh;
        }

        .layout iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="layout">

        <iframe src="side.html" name="side" title="Menu"></iframe>

        <iframe src="home.html" name="content" title="Content"></iframe>

    </div>

</body>
</html>
