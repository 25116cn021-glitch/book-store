<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body class="main">

    <p class="crumb">Home / Login</p>

    <div class="auth">

        <div class="form-box">
            <h2>Login</h2>
            <form>
                <table>
                    <tr>
                        <td>User Name:</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <div class="auth-note">
            <h3>New here?</h3>
            <p>Create an account to keep track of your cart and orders.</p>
            <a href="registration.html">Register now &raquo;</a>
        </div>

    </div>

    <p class="footer">&copy; Online Book Store | G.L. Bajaj Institute of Technology and Management</p>

</body>
</html>
