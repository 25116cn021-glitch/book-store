<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body class="main">

    <p class="crumb">Home / Login</p>

    <div class="auth">

        <div class="form-box">
            <h2>Login</h2>
            <form>
                <table>
                    <tr>
                        <td>User Name:</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <div class="auth-note">
            <h3>New here?</h3>
            <p>Create an account to keep track of your cart and orders.</p>
            <a href="registration.html">Register now &raquo;</a>
        </div>

    </div>

    <p class="footer">&copy; Online Book Store | G.L. Bajaj Institute of Technology and Management</p>

</body>
</html>

<form onsubmit="return validateForm()">

    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <br><br>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password">
    <br><br>

    <button type="submit">Register</button>

</form>

<script>
function validateForm() {
    let name = document.getElementById("name").value.trim();
    let password = document.getElementById("password").value;

    if (name === "") {
        alert("Please enter your name");
        return false;
    }

    if (password.length < 6) {
        alert("Password must contain at least 6 characters");
        return false;
    }

    alert("Registration successful!");
    return true;
}
</script>
<style>
  /* Make all labels, placeholder text, and credentials visible */
  label,
  form label,
  .form-group label,
  form span,
  form p {
    color: #111827 !important;            /* High-contrast dark charcoal */
    background-color: transparent !important; /* Removes any yellow highlight */
    font-weight: 600 !important;          /* Makes text clearly readable */
  }

  /* Fix input text so typed letters aren't washed out */
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    color: #111827 !important;
    background-color: #ffffff !important;
  }
</style>
